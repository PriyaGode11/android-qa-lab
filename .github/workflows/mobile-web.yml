name: Mobile web regression (Playwright)

on:
  push:
    branches: [main]
    paths:
      - "mobile-web-playwright/**"
      - ".github/workflows/mobile-web.yml"
  pull_request:
    paths:
      - "mobile-web-playwright/**"
      - ".github/workflows/mobile-web.yml"
  schedule:
    - cron: "37 7 * * *"   # nightly
  workflow_dispatch:
    inputs:
      record_videos:
        description: "Record a video of every test (for demos)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Pixel 7, iPhone 14, Desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-web-playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: npm install

      - name: Install browsers (Chromium for Android, WebKit for iPhone)
        run: npx playwright install --with-deps chromium webkit

      - name: Run regression suite
        run: npx playwright test
        env:
          RECORD_VIDEO: ${{ inputs.record_videos && '1' || '' }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml

      - name: Publish test summary
        if: always()
        run: python3 scripts/summary.py test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mobile-web-playwright/playwright-report/
          retention-days: 14

      - name: Upload screenshots, videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: mobile-web-playwright/test-results/
          retention-days: 14
