name: Publish TaskLab web app

on:
  push:
    branches: [main]
    paths:
      - "android-qa-lab/mobile-web-playwright/app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: android-qa-lab/mobile-web-playwright/app

      - id: deployment
        uses: actions/deploy-pages@v4
