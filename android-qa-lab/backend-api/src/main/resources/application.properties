spring.application.name=tasklab-api

# Local runs use an in-memory H2 database, so `mvn spring-boot:run` works with no setup.
# Integration tests replace this with a real PostgreSQL started by Testcontainers.
# Point at your own PostgreSQL with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:h2:mem:tasklab;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# "Today" (for overdue tasks) is calculated in this time zone.
tasklab.time-zone=America/Chicago
